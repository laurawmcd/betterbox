title: Betterbox
description: >- # this means to ignore newlines until "baseurl:"
  A design tool for ethical, effective technologies
baseurl: "" # the site is served from the root of betterbox.tech
url: "https://betterbox.tech"
# Serve every page at a folder-style URL (/cards/users/developer/), which is how all internal links are written
permalink: pretty
repository: laurawmcd/betterbox
github_username: laurawmcd
# Build settings
theme: jekyll-theme-cayman
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
# Jekyll SEO Tag settings
lang: en_US
social:
  name: Laura Walker McDonald
  links:
    - https://twitter.com/techladylaura
    - https://github.com/laurawmcd
# Navigation
nav:
  - title: Home
    url: /
  - title: Cards
    url: /cards/
  - title: About
    url: /about/
waitlist_url: https://www.laurawalkermcdonald.com/contact
# Every page under cards/ uses the card layout unless its front matter says otherwise (suit index pages use "suit")
defaults:
  - scope:
      path: "cards"
    values:
      layout: card
# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
