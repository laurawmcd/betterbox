  suit: context
  number: 8
  title: Cultural context
  status: confirmed
  sources:
  - sheet_2025_07
  - gdoc_2018
  card_text: |-
    Are the ways that cultures intersect with technology and power influential on the goals of your project? For example, who holds power in the local community? How do different languages, beliefs and customs co-exist? And how are technologies seen within those communities? Who has access to technology? Is it constrained or monitored, and by whom? Are there relevant taboos or beliefs?

    Understanding the relationships between technology and society can help improve project design and avoid or mitigate some risks.
