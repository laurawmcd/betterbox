- id: people-first-data-practices
  suit: context
  number: 7
  title: Establish people-first data practices
  status: confirmed
  sources:
  - sheet_2025_07
  - deck_v0.2
  - gdoc_2018
  card_text: |-
    Digital services and initiatives generate, rely on, and/or use people’s data. It is critical to put people’s rights and needs first when collecting, sharing, analyzing, or deleting data, and to follow applicable rules and guidelines.

    People-first data practices include ensuring people have meaningful consent and control over how their data is used, managed and maintained.
  card_text_status: indesign
