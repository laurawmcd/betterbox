  card_text: |-
    This powerful exercise produces the values that should guide your action.

    As a group, sort the Values suit, prioritizing, clustering and discarding. Add organizational values and principles on blank cards. Layer in any cards from other suits, such as Accessibility, that speak to your priorities.

    How does your project live up to these Values?
