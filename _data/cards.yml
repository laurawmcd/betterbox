# Betterbox card data. One entry per card slot. Source of truth for site pages, the print PDF and card QR/short links.
# Layout: 13 numbered cards in each of the four suits plus one blank (14 per suit), and 22 Values. 4 x 14 + 22 = 78, a tarot-size deck.
# Built 2026-09-26. Web text for each card lives in _data/web/<suit>.yml, keyed by id.
#
# status:            confirmed = in the live sheet (edited 2025-07-06); proposed = added by this restructure, needs your yes/no;
#                    open = empty slot; blank = blank card.
# card_text:         printed on the card; paragraphs separated by a blank line. card_text_status: indesign = from
#                    Betterbox_deck_v0.2.idml (Nov 2026); draft = written in the Sept 2026 restructure.
# card_text_approved / web_text_approved: set to true only by Laura. Nothing is printed or published until true.
# sheet_note:        description text from the live sheet cell (Non-functional requirements).
# digital_principle: the card matches one of the nine Principles for Digital Development (2024 update).
# old_site_page / redirect_from: the old URL, and the redirect that keeps it working (jekyll-redirect-from).
# needs:             what is left to do on the card.

