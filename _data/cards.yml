  - gdoc_2018
  - old_site
  card_text: Can the technology handle network instability, power failure, or hardware failure? Are critical systems, such
    as servers, protected with uninterruptible power supplies to allow them to shut down safely, or back-up storage to provide
    redundancy? How might networked servers need to handle high latency or downtime? Can systems automatically manage and
