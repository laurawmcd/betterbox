- id: legal-issues
  suit: context
  number: 2
  title: Legal issues
  status: confirmed
  sources:
  - sheet_2025_07
  - deck_v0.2
  card_text: |-
    What, if any, local, regional, national or international law applies to the project?

    Consider whether there is domain-specific regulation that may apply, for example, relating to health information.

    Look at legislation in the target geography, and ensure you understand whether laws in the jurisdictions where data is housed or transmitted - for example, in the cloud - may also apply.
  card_text_status: indesign
  path: /cards/context/legal-issues/
