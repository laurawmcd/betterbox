  suit: exercises
  number: 10
  title: Project management
  status: confirmed
  sources:
  - sheet_2025_07
  - deck_v0.2
  - gdoc_2018
  card_text: |-
    Less an exercise than a practice, effective project management brings in many of the practices that make technology projects better.

    Those practices include setting clear goals and underlying objectives, planning and monitoring progress, clear ownership and stakeholder management, and identifying and mitigating risks.

    Discuss whether strengthening these practices in the management of the project might help lead to better outcomes.
