- folder: non-functional-requirements
  name: Non-functional requirements
  color: '#2C4A94'
  pip: diamond
  cards:
  - title: Accessibility
    slug: accessibility
    summary: Ensure usability for people with different abilities and needs
    face: |-
      How is the technology usable for people with different physical and other abilities? For example, does it work for people who are colorblind? Can people manipulate the technology successfully if they are missing limbs or digits? Does the technology make assumptions about height or movement? Does it follow relevant accessibility requirements?

      Sometimes, testing or evaluating such considerations can lead to design improvements. At others, it can indicate the need to maintain other options for people who cannot engage with the technology successfully.
  - title: Localization
    slug: localization
    summary: Support multiple languages and cultural contexts
  - title: Security
    slug: security
    summary: Protect against threats and ensure data protection
    face: |-
      How will the technology be secured, in the database and as it is transmitted? How will you manage user access and authentication, and educate users on important cyber hygiene practices like two-factor authentication and password safety?

      The extent to which you are able to manage the inherent cybersecurity risks of collecting, managing and securing data should inform the overall risk/benefit analysis for the proposed project.
  - title: Robustness
    slug: robustness
    summary: Handle errors and unexpected conditions gracefully
  - title: Performance
    slug: performance
    summary: Ensure speed, responsiveness, and efficiency
  - title: Interoperability
    slug: interoperability
    summary: Work effectively with other systems and standards
  - title: Configurability
    slug: configurability
    summary: Allow for customization and adaptation
  - title: Data Integrity
    slug: data-integrity
    summary: Maintain accuracy and consistency of information
  - title: Help
    slug: help
    summary: Provide effective user assistance and documentation
  - title: Installability
    slug: installability
    summary: Enable smooth deployment and setup
  - title: Legal
    slug: legal
    summary: Comply with relevant laws and regulations
  - title: Licensing & Copyright
    slug: licensing-copyright
    summary: Manage intellectual property rights effectively
  - title: Custom Requirement
    blank: true
    summary: Add your own non-functional requirement
