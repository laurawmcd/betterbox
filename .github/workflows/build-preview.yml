# Builds the site the same way GitHub Pages does, so a pull request shows whether it builds,
# and uploads the built site as a downloadable artifact for previewing.
name: Build preview
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
